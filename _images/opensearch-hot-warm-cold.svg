<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="t d">
  <title id="t">Log analytics storage tiering in OpenSearch: hot, warm, and searchable snapshots</title>
  <desc id="d">Inside the OpenSearch cluster, new log indexes live on hot nodes with local NVMe and node.attr.temp hot for days 0 to 3. ISM rolls them over at 3 days or 50 GB and changes the allocation filter to temp warm, so the shards move to warm nodes with EBS and one replica, where they stay until day 90. ISM also snapshots each index to the logs-s3-repository S3 repository, then deletes the index from the cluster at 90 days. The snapshot stays in S3. When old data is needed, it is restored with storage_type remote_snapshot onto on-demand searchable snapshot nodes with the warm role, running on a Karpenter NodePool with an Instance Store cache.</desc>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b">

    <!-- scopes -->
    <rect x="15" y="45" width="590" height="330" rx="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="28" y="32" font-size="16" font-weight="700" fill="#3b82f6">OpenSearch cluster (managed by ISM)</text>
    <text x="700" y="32" font-size="16" font-weight="700" fill="#16a34a">Object storage</text>

    <!-- hot tier -->
    <rect x="40" y="65" width="220" height="140" rx="12" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="150" y="93" font-size="16" font-weight="700" fill="#3b82f6">Hot tier</text>
      <text x="150" y="113" font-weight="600" fill="#3b82f6">days 0 to 3</text>
      <text x="150" y="140">local NVMe (Instance Store)</text>
      <text x="150" y="158">node.attr.temp: hot</text>
      <text x="150" y="176">indexing + recent search</text>
    </g>

    <!-- hot -> warm -->
    <line x1="263" y1="135" x2="366" y2="135" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#mb)"/>
    <g text-anchor="middle">
      <text x="315" y="108">rollover</text>
      <text x="315" y="124">3d or 50 GB</text>
      <text x="315" y="154">allocation:</text>
      <text x="315" y="170">temp=warm</text>
    </g>

    <!-- warm tier -->
    <rect x="370" y="65" width="220" height="140" rx="12" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="480" y="93" font-size="16" font-weight="700" fill="#3b82f6">Warm tier</text>
      <text x="480" y="113" font-weight="600" fill="#3b82f6">days 3 to 90</text>
      <text x="480" y="140">EBS</text>
      <text x="480" y="158">node.attr.temp: warm</text>
      <text x="480" y="176">1 replica, slower queries</text>
    </g>

    <!-- warm -> S3 -->
    <line x1="593" y1="135" x2="696" y2="135" stroke="#16a34a" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="652" y="124" text-anchor="middle">ISM snapshot</text>

    <!-- S3 -->
    <rect x="700" y="65" width="220" height="140" rx="12" fill="none" stroke="#16a34a" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="810" y="93" font-size="16" font-weight="700" fill="#16a34a">S3 repository</text>
      <text x="810" y="113" font-weight="600" fill="#16a34a">only copy after day 90</text>
      <text x="810" y="140">logs-s3-repository</text>
      <text x="810" y="158">one snapshot per index</text>
      <text x="810" y="176">kept after deletion</text>
    </g>

    <!-- warm -> delete -->
    <line x1="480" y1="207" x2="480" y2="231" stroke="#64748b" stroke-width="2" marker-end="url(#mg)"/>
    <rect x="395" y="235" width="170" height="44" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="480" y="262" text-anchor="middle" font-size="14" font-weight="600">deleted at day 90</text>

    <!-- searchable snapshot nodes -->
    <rect x="40" y="290" width="290" height="70" rx="10" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4"/>
    <g text-anchor="middle">
      <text x="185" y="314" font-size="14" font-weight="700" fill="#3b82f6">Searchable snapshot nodes</text>
      <text x="185" y="334">node.roles: [warm], on demand</text>
      <text x="185" y="351">Karpenter NodePool, Instance Store cache</text>
    </g>

    <!-- S3 -> searchable -->
    <path d="M810,207 L810,325 L334,325" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#mt)"/>
    <text x="822" y="250">_restore with</text>
    <text x="822" y="266">storage_type:</text>
    <text x="822" y="282">remote_snapshot</text>
  </g>
</svg>

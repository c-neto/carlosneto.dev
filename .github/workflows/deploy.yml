name: 🚀 Deploy Website

on:
  workflow_dispatch: {}
  # Daily rebuild so the /analytics page gets fresh GoatCounter numbers.
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - blog/**
      - analytics.md
      - _templates/**
      - _static/analytics.*
      - scripts/goatcounter_export.py

permissions:
  contents: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Export analytics
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/goatcounter_export.py

      - name: Build the site
        run: make dirhtml

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/dirhtml
          cname: carlosneto.dev

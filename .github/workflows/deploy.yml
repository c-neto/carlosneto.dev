name: 🚀 Deploy Website

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - blog/**
      - index.md
      - contribution-list.md
      - analytics.md
      - _templates/**
      - _static/analytics.*

permissions:
  contents: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    # Shared with analytics.yml so the two never push to gh-pages at the same time.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    container:
      image: ghcr.io/${{ github.repository }}-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: post_header counts the commits of each post.
          fetch-depth: 0

      # The publish step below replaces everything on gh-pages, so carry over the
      # analytics.json that analytics.yml keeps there. Missing file is fine.
      - name: Keep published analytics data
        run: |
          python3 - <<'EOF'
          import urllib.request
          url = "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/_static/analytics.json"
          try:
              data = urllib.request.urlopen(url, timeout=30).read()
              open("_static/analytics.json", "wb").write(data)
              print(f"Kept analytics.json ({len(data)} bytes)")
          except Exception as err:
              print(f"::notice::No published analytics.json to keep: {err}")
          EOF

      - name: Build the site
        run: make dirhtml

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/dirhtml
          cname: carlosneto.dev

name: deploy-website

# Rebuild and publish the site when a post changes
on:
  push:
    branches:
      - main
    paths:
      - blog/**
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    # Prebuilt image with the Sphinx dependencies (see Dockerfile)
    container:
      image: ghcr.io/${{ github.repository }}-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: make dirhtml

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/dirhtml
          cname: carlosneto.dev

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Logs from four environment clusters in one OpenSearch index series, read through per-environment filtered aliases</title>
  <desc id="d">Four source clusters, dev, stage, sandbox and prod, ship their application logs through the my-app-logs rollover alias into the current write index of one my-app-logs index series. Each document carries an environment field set from its source cluster. Four read-only filtered aliases, my-app-logs-dev, my-app-logs-stage, my-app-logs-sandbox and my-app-logs-prod, point at the same index series, and each one filters on its environment value.</desc>
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
    <!-- write path: one source cluster per environment -->
    <text x="20" y="30" font-size="16" font-weight="700" fill="#3b82f6">Sources: one cluster per env</text>
    <g fill="none" stroke="#3b82f6" stroke-width="2">
      <rect x="20" y="52" width="170" height="44" rx="10"/>
      <rect x="20" y="118" width="170" height="44" rx="10"/>
      <rect x="20" y="184" width="170" height="44" rx="10"/>
      <rect x="20" y="250" width="170" height="44" rx="10"/>
      <rect x="260" y="145" width="190" height="56" rx="10"/>
      <line x1="192" y1="74" x2="256" y2="163" marker-end="url(#aw)"/>
      <line x1="192" y1="140" x2="256" y2="169" marker-end="url(#aw)"/>
      <line x1="192" y1="206" x2="256" y2="177" marker-end="url(#aw)"/>
      <line x1="192" y1="272" x2="256" y2="183" marker-end="url(#aw)"/>
      <line x1="452" y1="173" x2="521" y2="230" marker-end="url(#aw)"/>
    </g>
    <g text-anchor="middle">
      <text x="105" y="71" font-weight="600" fill="#3b82f6">dev cluster</text>
      <text x="105" y="88" font-size="12" fill="#64748b">environment: dev</text>
      <text x="105" y="137" font-weight="600" fill="#3b82f6">stage cluster</text>
      <text x="105" y="154" font-size="12" fill="#64748b">environment: stage</text>
      <text x="105" y="203" font-weight="600" fill="#3b82f6">sandbox cluster</text>
      <text x="105" y="220" font-size="12" fill="#64748b">environment: sandbox</text>
      <text x="105" y="269" font-weight="600" fill="#3b82f6">prod cluster</text>
      <text x="105" y="286" font-size="12" fill="#64748b">environment: prod</text>
    </g>
    <text x="355" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#3b82f6">Writes</text>
    <text x="355" y="169" text-anchor="middle" font-weight="600" fill="#3b82f6">my-app-logs</text>
    <text x="355" y="189" text-anchor="middle" font-size="12" fill="#64748b">is_write_index: true</text>

    <!-- index series -->
    <rect x="510" y="44" width="180" height="270" rx="12" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="600" y="70" text-anchor="middle" font-weight="700" fill="#64748b">Index series</text>
    <g fill="none" stroke="#64748b" stroke-width="1.5">
      <rect x="520" y="92" width="160" height="40" rx="8"/>
      <rect x="520" y="152" width="160" height="40" rx="8"/>
    </g>
    <rect x="520" y="210" width="160" height="40" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="600" y="117" text-anchor="middle" font-size="13" fill="#64748b">my-app-logs-000001</text>
    <text x="600" y="177" text-anchor="middle" font-size="13" fill="#64748b">my-app-logs-000002</text>
    <text x="600" y="235" text-anchor="middle" font-size="13" fill="#3b82f6">my-app-logs-000003</text>
    <text x="600" y="290" text-anchor="middle" font-size="11" fill="#64748b">one mapping, one set of shards</text>

    <!-- read path -->
    <text x="760" y="30" font-size="16" font-weight="700" fill="#16a34a">Reads: filtered aliases</text>
    <g fill="none" stroke="#16a34a" stroke-width="2">
      <rect x="760" y="52" width="180" height="44" rx="10"/>
      <rect x="760" y="118" width="180" height="44" rx="10"/>
      <rect x="760" y="184" width="180" height="44" rx="10"/>
      <rect x="760" y="250" width="180" height="44" rx="10"/>
      <line x1="758" y1="74" x2="694" y2="112" marker-end="url(#ar)"/>
      <line x1="758" y1="140" x2="694" y2="152" marker-end="url(#ar)"/>
      <line x1="758" y1="206" x2="694" y2="198" marker-end="url(#ar)"/>
      <line x1="758" y1="272" x2="694" y2="238" marker-end="url(#ar)"/>
    </g>
    <g text-anchor="middle">
      <text x="850" y="71" font-weight="600" fill="#16a34a">my-app-logs-dev</text>
      <text x="850" y="88" font-size="12" fill="#64748b">environment: dev</text>
      <text x="850" y="137" font-weight="600" fill="#16a34a">my-app-logs-stage</text>
      <text x="850" y="154" font-size="12" fill="#64748b">environment: stage</text>
      <text x="850" y="203" font-weight="600" fill="#16a34a">my-app-logs-sandbox</text>
      <text x="850" y="220" font-size="12" fill="#64748b">environment: sandbox</text>
      <text x="850" y="269" font-weight="600" fill="#16a34a">my-app-logs-prod</text>
      <text x="850" y="286" font-size="12" fill="#64748b">environment: prod</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">OpenSearch storage tiers used to cut storage cost: hot on NVMe with replicas, warm on EBS without replicas, searchable snapshots from S3</title>
  <desc id="d">Inside the OpenSearch cluster, indexes spend days 0 to 3 on hot nodes with local NVMe, no EBS, and one or two replicas. After 3 days they move to warm nodes with a 16 TiB gp3 EBS volume each, and their replicas are set to zero, so durability comes from EBS. They are deleted from the cluster at day 180. Every index is snapshotted to an S3 repository after rollover at 03:00 UTC, before its replicas are removed, and the snapshot is kept after deletion. When an audit needs old data, the snapshot is restored on demand onto a searchable snapshot node with a local NVMe cache, no EBS, and zero replicas.</desc>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b">

    <!-- cluster scope -->
    <rect x="15" y="45" width="930" height="200" rx="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="28" y="32" font-size="16" font-weight="700" fill="#3b82f6">OpenSearch cluster (managed by ISM)</text>

    <!-- hot tier -->
    <rect x="40" y="70" width="240" height="150" rx="12" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="160" y="98" font-size="16" font-weight="700" fill="#3b82f6">Hot tier</text>
      <text x="160" y="118" font-weight="600" fill="#3b82f6">days 0 to 3</text>
      <text x="160" y="145">local NVMe, no EBS</text>
      <text x="160" y="165">1 to 2 replicas</text>
      <text x="160" y="185">indexing + live search</text>
    </g>

    <!-- hot -> warm -->
    <line x1="283" y1="145" x2="356" y2="145" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#mb)"/>
    <g text-anchor="middle">
      <text x="320" y="130">after 3d</text>
      <text x="320" y="166">replicas 0</text>
    </g>

    <!-- warm tier -->
    <rect x="360" y="70" width="240" height="150" rx="12" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="480" y="98" font-size="16" font-weight="700" fill="#3b82f6">Warm tier</text>
      <text x="480" y="118" font-weight="600" fill="#3b82f6">days 3 to 180</text>
      <text x="480" y="145">16 TiB gp3 EBS per node</text>
      <text x="480" y="165">0 replicas, durability from EBS</text>
      <text x="480" y="185">deleted from the cluster at 180d</text>
    </g>

    <!-- searchable tier -->
    <rect x="680" y="70" width="240" height="150" rx="12" fill="none" stroke="#16a34a" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="800" y="98" font-size="16" font-weight="700" fill="#16a34a">Searchable tier</text>
      <text x="800" y="118" font-weight="600" fill="#16a34a">after 180d, on demand</text>
      <text x="800" y="145">local NVMe cache, no EBS</text>
      <text x="800" y="165">0 replicas</text>
      <text x="800" y="185">audits</text>
    </g>

    <!-- S3 repository -->
    <rect x="680" y="285" width="240" height="80" rx="12" fill="none" stroke="#16a34a" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="800" y="312" font-size="16" font-weight="700" fill="#16a34a">S3 snapshot repository</text>
      <text x="800" y="335">one snapshot per index</text>
      <text x="800" y="353">kept after the index is deleted</text>
    </g>

    <!-- hot -> S3 snapshot -->
    <polyline points="160,220 160,325 676,325" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="420" y="315" text-anchor="middle">snapshot after rollover at 03:00 UTC, before replicas drop</text>

    <!-- S3 -> searchable restore -->
    <line x1="800" y1="283" x2="800" y2="224" stroke="#16a34a" stroke-width="2.5" marker-end="url(#mt)"/>
    <text x="810" y="262">restore on demand</text>
  </g>
</svg>

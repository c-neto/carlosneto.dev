<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d">
  <title id="t">Switching from Prometheus to Datadog changes only the Collector exporter</title>
  <desc id="d">Before: app.py with the OpenTelemetry API and SDK sends OTLP to the Collector, whose otlp receiver passes the data to a prometheus exporter, and Prometheus scrapes it. After: the same app.py and SDK configuration send OTLP to the same Collector, and only the exporter changes to datadog, which sends the data to Datadog.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">

    <!-- BEFORE -->
    <text x="20" y="28" font-size="16" font-weight="700" fill="#64748b">Before</text>
    <rect x="20" y="50" width="200" height="80" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="120" y="85" text-anchor="middle" font-weight="600" fill="#64748b">app.py</text>
    <text x="120" y="107" text-anchor="middle" font-size="12" fill="#3b82f6">OTel API + SDK</text>
    <line x1="222" y1="90" x2="296" y2="90" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
    <text x="259" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">OTLP</text>

    <rect x="300" y="40" width="400" height="100" rx="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="500" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#3b82f6">OTel Collector</text>
    <rect x="320" y="70" width="160" height="54" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="400" y="92" text-anchor="middle" font-size="12" fill="#64748b">receiver</text>
    <text x="400" y="112" text-anchor="middle" font-weight="600" fill="#64748b">otlp</text>
    <line x1="482" y1="97" x2="516" y2="97" stroke="#64748b" stroke-width="2" marker-end="url(#ag)"/>
    <rect x="520" y="70" width="160" height="54" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="600" y="92" text-anchor="middle" font-size="12" fill="#64748b">exporter</text>
    <text x="600" y="112" text-anchor="middle" font-weight="600" fill="#64748b">prometheus</text>

    <line x1="702" y1="90" x2="756" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#ag)"/>
    <rect x="760" y="50" width="180" height="80" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="850" y="95" text-anchor="middle" font-weight="600" fill="#64748b">Prometheus</text>

    <!-- AFTER -->
    <text x="20" y="198" font-size="16" font-weight="700" fill="#64748b">After</text>
    <rect x="20" y="220" width="200" height="80" rx="10" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="120" y="250" text-anchor="middle" font-weight="600" fill="#64748b">app.py</text>
    <text x="120" y="270" text-anchor="middle" font-size="12" fill="#3b82f6">OTel API + SDK</text>
    <text x="120" y="288" text-anchor="middle" font-size="11" fill="#64748b">(unchanged)</text>
    <line x1="222" y1="260" x2="296" y2="260" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>
    <text x="259" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">OTLP</text>

    <rect x="300" y="210" width="400" height="100" rx="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="500" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#3b82f6">OTel Collector</text>
    <rect x="320" y="240" width="160" height="54" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="400" y="262" text-anchor="middle" font-size="12" fill="#64748b">receiver</text>
    <text x="400" y="282" text-anchor="middle" font-weight="600" fill="#64748b">otlp</text>
    <line x1="482" y1="267" x2="516" y2="267" stroke="#64748b" stroke-width="2" marker-end="url(#ag)"/>
    <rect x="520" y="240" width="160" height="54" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="600" y="262" text-anchor="middle" font-size="12" fill="#f59e0b">exporter (changed)</text>
    <text x="600" y="282" text-anchor="middle" font-weight="700" fill="#f59e0b">datadog</text>

    <line x1="702" y1="260" x2="756" y2="260" stroke="#f59e0b" stroke-width="2" marker-end="url(#aa)"/>
    <rect x="760" y="220" width="180" height="80" rx="10" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="850" y="265" text-anchor="middle" font-weight="600" fill="#f59e0b">Datadog</text>

    <text x="480" y="352" text-anchor="middle" font-size="13" fill="#64748b">app.py and the SDK configuration stay the same. Only the exporter in collector.yaml changes.</text>
  </g>
</svg>

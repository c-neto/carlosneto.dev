<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">The optional OpenTelemetry Collector centralizes the telemetry pipeline</title>
  <desc id="d">Three services, written in Python, Java, and Go, each use the OpenTelemetry SDK and send OTLP to the same OpenTelemetry Collector. The Collector holds the pipeline logic in one place: it filters by metadata, changes attributes, samples traces, and routes the data. It sends the data to a metrics backend such as Prometheus, and switching to Datadog or Grafana Mimir is a change in the Collector configuration, not in the services.</desc>
  <defs>
    <marker id="cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="cg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
    <!-- services -->
    <text x="20" y="30" font-size="16" font-weight="700" fill="#64748b">Your services</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <rect x="20" y="50" width="220" height="60" rx="10"/>
      <rect x="20" y="132" width="220" height="60" rx="10"/>
      <rect x="20" y="214" width="220" height="60" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="130" y="75" font-weight="600" fill="#64748b">Payments (Python)</text>
      <text x="130" y="95" font-size="12" fill="#3b82f6">OTel SDK</text>
      <text x="130" y="157" font-weight="600" fill="#64748b">Orders (Java)</text>
      <text x="130" y="177" font-size="12" fill="#3b82f6">OTel SDK</text>
      <text x="130" y="239" font-weight="600" fill="#64748b">Gateway (Go)</text>
      <text x="130" y="259" font-size="12" fill="#3b82f6">OTel SDK</text>
    </g>
    <g fill="none" stroke="#3b82f6" stroke-width="2">
      <line x1="242" y1="80" x2="356" y2="140" marker-end="url(#cb)"/>
      <line x1="242" y1="162" x2="356" y2="162" marker-end="url(#cb)"/>
      <line x1="242" y1="244" x2="356" y2="184" marker-end="url(#cb)"/>
    </g>
    <text x="300" y="150" text-anchor="middle" font-weight="700" fill="#3b82f6">OTLP</text>

    <!-- collector -->
    <rect x="360" y="50" width="260" height="224" rx="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="490" y="80" text-anchor="middle" font-weight="700" fill="#3b82f6">OTel Collector</text>
    <text x="490" y="98" text-anchor="middle" font-size="12" fill="#64748b">(optional)</text>
    <g text-anchor="middle" fill="#64748b">
      <text x="490" y="132">filter by metadata</text>
      <text x="490" y="160">change attributes</text>
      <text x="490" y="188">sample traces</text>
      <text x="490" y="216">route to backends</text>
    </g>
    <text x="490" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">one central configuration</text>

    <!-- backends -->
    <text x="700" y="30" font-size="16" font-weight="700" fill="#64748b">Backends (not OTel)</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <rect x="720" y="64" width="220" height="44" rx="10"/>
      <rect x="720" y="140" width="220" height="44" rx="10"/>
      <rect x="720" y="216" width="220" height="44" rx="10"/>
    </g>
    <line x1="622" y1="162" x2="716" y2="88" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#cb)"/>
    <g fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5">
      <line x1="622" y1="162" x2="716" y2="162" marker-end="url(#cg)"/>
      <line x1="622" y1="162" x2="716" y2="236" marker-end="url(#cg)"/>
    </g>
    <g text-anchor="middle" font-weight="600">
      <text x="830" y="91" fill="#3b82f6">Prometheus</text>
      <text x="830" y="167" fill="#64748b">Datadog</text>
      <text x="830" y="243" fill="#64748b">Grafana Mimir</text>
    </g>
    <text x="480" y="314" text-anchor="middle" font-size="13" fill="#64748b">The pipeline logic and the destinations live in the Collector, not in each service.</text>
  </g>
</svg>

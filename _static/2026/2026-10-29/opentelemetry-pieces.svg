<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">The pieces of OpenTelemetry, from the application to the backends</title>
  <desc id="d">Inside the application, your code calls the OpenTelemetry API and the OpenTelemetry SDK, with instrumentation libraries, processes and exports the data. The SDK sends it over the OTLP protocol, usually to the optional OpenTelemetry Collector, which receives, processes, and exports it. The Collector sends the data to backends such as Prometheus, Datadog, Jaeger, and OpenSearch, which are not part of OpenTelemetry.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
    <!-- OpenTelemetry scope -->
    <rect x="10" y="40" width="640" height="285" rx="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="24" y="30" font-size="16" font-weight="700" fill="#3b82f6">OpenTelemetry</text>

    <!-- application -->
    <rect x="30" y="60" width="250" height="245" rx="12" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="155" y="84" text-anchor="middle" font-weight="700" fill="#64748b">Your application</text>
    <rect x="50" y="98" width="210" height="44" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="155" y="125" text-anchor="middle" fill="#64748b">Your code</text>
    <rect x="50" y="160" width="210" height="44" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="155" y="180" text-anchor="middle" font-weight="600" fill="#3b82f6">OTel API</text>
    <text x="155" y="196" text-anchor="middle" font-size="12" fill="#64748b">what to measure</text>
    <rect x="50" y="222" width="210" height="62" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="155" y="245" text-anchor="middle" font-weight="600" fill="#3b82f6">OTel SDK</text>
    <text x="155" y="262" text-anchor="middle" font-size="12" fill="#64748b">how to process and send</text>
    <text x="155" y="277" text-anchor="middle" font-size="12" fill="#64748b">+ instrumentation libraries</text>
    <g fill="none" stroke="#64748b" stroke-width="1.5">
      <line x1="155" y1="143" x2="155" y2="157" marker-end="url(#ag)"/>
      <line x1="155" y1="205" x2="155" y2="219" marker-end="url(#ag)"/>
    </g>

    <!-- OTLP -->
    <line x1="262" y1="253" x2="386" y2="253" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ab)"/>
    <text x="324" y="243" text-anchor="middle" font-weight="700" fill="#3b82f6">OTLP</text>
    <text x="324" y="273" text-anchor="middle" font-size="12" fill="#64748b">standard protocol</text>

    <!-- collector -->
    <rect x="390" y="60" width="240" height="245" rx="12" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="510" y="84" text-anchor="middle" font-weight="700" fill="#3b82f6">OTel Collector <tspan font-weight="400" font-size="12" fill="#64748b">(optional)</tspan></text>
    <g fill="none" stroke="#3b82f6" stroke-width="1.5">
      <rect x="410" y="98" width="200" height="44" rx="8"/>
      <rect x="410" y="160" width="200" height="44" rx="8"/>
      <rect x="410" y="222" width="200" height="62" rx="8"/>
    </g>
    <text x="510" y="118" text-anchor="middle" font-weight="600" fill="#3b82f6">Receivers</text>
    <text x="510" y="134" text-anchor="middle" font-size="12" fill="#64748b">otlp</text>
    <text x="510" y="180" text-anchor="middle" font-weight="600" fill="#3b82f6">Processors</text>
    <text x="510" y="196" text-anchor="middle" font-size="12" fill="#64748b">batch, filter, attributes</text>
    <text x="510" y="248" text-anchor="middle" font-weight="600" fill="#3b82f6">Exporters</text>
    <text x="510" y="266" text-anchor="middle" font-size="12" fill="#64748b">prometheus, datadog, ...</text>
    <g fill="none" stroke="#3b82f6" stroke-width="1.5">
      <line x1="510" y1="143" x2="510" y2="157" marker-end="url(#ab)"/>
      <line x1="510" y1="205" x2="510" y2="219" marker-end="url(#ab)"/>
    </g>

    <!-- backends -->
    <text x="720" y="30" font-size="16" font-weight="700" fill="#64748b">Backends (not OTel)</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <rect x="720" y="60" width="220" height="44" rx="10"/>
      <rect x="720" y="122" width="220" height="44" rx="10"/>
      <rect x="720" y="184" width="220" height="44" rx="10"/>
      <rect x="720" y="246" width="220" height="44" rx="10"/>
      <line x1="632" y1="253" x2="716" y2="84" marker-end="url(#ag)"/>
      <line x1="632" y1="253" x2="716" y2="146" marker-end="url(#ag)"/>
      <line x1="632" y1="253" x2="716" y2="208" marker-end="url(#ag)"/>
      <line x1="632" y1="253" x2="716" y2="266" marker-end="url(#ag)"/>
    </g>
    <g text-anchor="middle" fill="#64748b">
      <text x="830" y="87" font-weight="600">Prometheus</text>
      <text x="830" y="149" font-weight="600">Datadog</text>
      <text x="830" y="211" font-weight="600">Jaeger</text>
      <text x="830" y="273" font-weight="600">OpenSearch</text>
    </g>
  </g>
</svg>

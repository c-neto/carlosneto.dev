<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="t d">
  <title id="t">OpenTelemetry removes vendor lock-in: the same SDK sends OTLP to whichever metrics backend you choose</title>
  <desc id="d">Inside the application, your code calls the OpenTelemetry API, and the OpenTelemetry SDK, with no vendor library, processes the data and sends OTLP directly to one metrics backend. Prometheus, Datadog, Grafana Mimir, and New Relic compete with each other, and all of them accept OTLP, so switching from one to another means changing the endpoint in the SDK configuration, not the code.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
    <!-- OpenTelemetry scope -->
    <rect x="10" y="40" width="320" height="270" rx="14" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="24" y="30" font-size="16" font-weight="700" fill="#3b82f6">OpenTelemetry</text>

    <!-- application -->
    <rect x="30" y="60" width="280" height="230" rx="12" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="170" y="86" text-anchor="middle" font-weight="700" fill="#64748b">Your application</text>
    <rect x="60" y="100" width="220" height="44" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="170" y="127" text-anchor="middle" fill="#64748b">Your code</text>
    <rect x="60" y="164" width="220" height="44" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="170" y="184" text-anchor="middle" font-weight="600" fill="#3b82f6">OTel API</text>
    <text x="170" y="200" text-anchor="middle" font-size="12" fill="#64748b">what to measure</text>
    <rect x="60" y="228" width="220" height="44" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="170" y="248" text-anchor="middle" font-weight="600" fill="#3b82f6">OTel SDK</text>
    <text x="170" y="264" text-anchor="middle" font-size="12" fill="#64748b">processes and sends, no vendor library</text>
    <g stroke="#64748b" stroke-width="1.5">
      <line x1="170" y1="145" x2="170" y2="160" marker-end="url(#ag)"/>
      <line x1="170" y1="209" x2="170" y2="224" marker-end="url(#ag)"/>
    </g>

    <!-- OTLP -->
    <text x="440" y="140" text-anchor="middle" font-weight="700" fill="#3b82f6">OTLP</text>

    <!-- backends -->
    <text x="620" y="30" font-size="16" font-weight="700" fill="#64748b">Metrics backends (not OTel)</text>
    <g fill="none" stroke="#64748b" stroke-width="2">
      <rect x="640" y="70" width="290" height="44" rx="10"/>
      <rect x="640" y="132" width="290" height="44" rx="10"/>
      <rect x="640" y="194" width="290" height="44" rx="10"/>
      <rect x="640" y="256" width="290" height="44" rx="10"/>
    </g>
    <line x1="282" y1="250" x2="636" y2="94" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ab)"/>
    <g fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5">
      <line x1="282" y1="250" x2="636" y2="156" marker-end="url(#ag)"/>
      <line x1="282" y1="250" x2="636" y2="218" marker-end="url(#ag)"/>
      <line x1="282" y1="250" x2="636" y2="278" marker-end="url(#ag)"/>
    </g>
    <g text-anchor="middle" font-weight="600">
      <text x="785" y="97" fill="#3b82f6">Prometheus</text>
      <text x="785" y="159" fill="#64748b">Datadog</text>
      <text x="785" y="221" fill="#64748b">Grafana Mimir</text>
      <text x="785" y="283" fill="#64748b">New Relic</text>
    </g>
    <text x="480" y="338" text-anchor="middle" font-size="13" fill="#64748b">Switching backends changes the SDK configuration, not the code.</text>
  </g>
</svg>
